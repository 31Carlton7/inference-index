name: Policy snapshot

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: policy-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Fetch policy pages
        run: python3 scripts/registry/snapshot.py | tee snapshot-summary.txt
      - name: Commit snapshots and drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/changelog-drafts 2>/dev/null || git add data/snapshots
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Policy snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Open an issue when a policy page changed or could not be read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today="$(date -u +%F)"
          drafts="data/changelog-drafts/$today.json"
          unreadable="$(grep -c '^  unreadable:' snapshot-summary.txt || true)"
          if [ ! -f "$drafts" ] && [ "$unreadable" = "0" ]; then
            exit 0
          fi
          {
            if [ -f "$drafts" ]; then
              echo "The daily snapshot found policy text that differs from the last snapshot."
              echo
              echo "Drafts: \`$drafts\`. Nothing is in the changelog yet. Read each one with \`python3 scripts/registry/review.py list\`, then accept or reject it."
              echo
            fi
            if [ "$unreadable" != "0" ]; then
              echo "$unreadable page(s) could not be read. Check whether each address moved or was withdrawn."
              echo
            fi
            echo '```'
            cat snapshot-summary.txt
            echo '```'
          } > issue-body.md
          if [ -f "$drafts" ]; then
            title="Policy pages changed on $today"
          else
            title="Policy pages unreadable on $today"
          fi
          gh issue create --title "$title" --body-file issue-body.md
