name: prices

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/prices/prices.test.mjs
      - run: node scripts/prices/scrape.mjs
      - name: Commit prices
        run: |
          git add data/prices
          if git diff --cached --quiet; then
            echo "no price changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prices for $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
